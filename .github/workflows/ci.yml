name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract, fonts and ShellCheck
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-liberation shellcheck
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          python -m pyflakes kollinsscan tests
          shellcheck install.sh
      - name: Run tests
        run: python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build image
        # Docker Hub often rate-limits GitHub's shared runners, so fetch the
        # base image from Google's Docker Hub mirror first.
        run: |
          docker pull mirror.gcr.io/library/python:3.12-slim
          docker tag mirror.gcr.io/library/python:3.12-slim python:3.12-slim
          docker build -t kollinsscan:ci .
      - name: Scan a page through the container
        run: |
          pip install -r requirements.txt
          (cd tests && python make_pages.py)
          docker run -d --name ks -p 8000:8000 \
            -e KOLLINSSCAN_ADMIN_PASSWORD=ci-password -e KOLLINSSCAN_SECURE_COOKIES=0 kollinsscan:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs -c jar -H 'Content-Type: application/json' \
            -d '{"user":"admin","password":"ci-password"}' localhost:8000/api/login
          book=$(curl -fs -b jar -H 'X-KollinsScan: 1' -H 'Content-Type: application/json' \
            -d '{"title":"CI Book"}' localhost:8000/api/books | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fs -b jar -H 'X-KollinsScan: 1' -F file=@tests/page1.jpg \
            localhost:8000/api/books/$book/pages | tee page.json
          grep -q 'CHAPTER ONE' page.json
          curl -fs -b jar "localhost:8000/api/books/$book/export?format=rtf" | tee book.rtf | head -c 600
          grep -q 'outlinelevel0' book.rtf
